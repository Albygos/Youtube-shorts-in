<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Shorts Converter</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #ff0000; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 5px;}
        button:hover { background: #cc0000; }
    </style>
</head>
<body>
    <h1>YouTube to Short Converter</h1>
    <form action="/convert" method="POST">
        <div class="form-group">
            <label for="url">YouTube URL:</label>
            <input type="url" id="url" name="url" required placeholder="https://www.youtube.com/watch?v=...">
        </div>
        <div class="form-group">
            <label for="start_time">Start Time (seconds):</label>
            <input type="number" id="start_time" name="start_time" value="0" required>
        </div>
        <div class="form-group">
            <label for="duration">Duration (seconds):</label>
            <input type="number" id="duration" name="duration" value="30" required max="60">
        </div>
        <button type="submit">Generate Short</button>
    </form>
</body>
</html>
